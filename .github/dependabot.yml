version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    # Only open pull requests for security updates...
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/packages/core"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    # Only open pull requests for security updates...
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/packages/alpine"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    # Only open pull requests for security updates...
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/packages/react"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    # Only open pull requests for security updates...
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/packages/vue"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    # Only open pull requests for security updates...
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    target-branch: "1.x"
    groups:
      github-actions:
        patterns:
          - "*"
